<!DOCTYPE html>
<html>
<head>
<title>Post to Juma Adventures</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
  input, textarea, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
  button { background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
  button:hover { background: #45a049; }
  img { max-width: 100%; margin: 5px; border-radius: 5px; }
</style>
</head>
<body>

<h1>Post to Juma Adventures</h1>

<input type="text" id="author" placeholder="Your Name">
<textarea id="caption" placeholder="Write your caption..."></textarea>
<input type="file" id="images" multiple accept="image/*">
<div id="preview"></div>
<button onclick="publishPost()">POST NOW</button>
<p id="status"></p>

<script>
// YOUR SUPABASE KEYS ✅
const SUPABASE_URL = 'https://ezkejiawykqfxllvbzjm.supabase.co'
const SUPABASE_KEY = 'sb_publishable_uWwptcdqC9-Yb-mYKqGuag_7dWYE1g7'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

document.getElementById('images').onchange = e => {
  document.getElementById('preview').innerHTML = '';
  Array.from(e.target.files).forEach(file => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    document.getElementById('preview').appendChild(img);
  })
}

async function publishPost() {
  const status = document.getElementById('status')
  status.innerText = 'Uploading...'

  const files = document.getElementById('images').files
  const imageUrls = []

  for (let file of files) {
    const fileName = Date.now() + '-' + file.name
    const { data, error } = await supabase.storage.from('posts').upload(fileName, file)
    if (error) { status.innerText = 'Upload error: ' + error.message; return; }
    const { data: urlData } = supabase.storage.from('posts').getPublicUrl(fileName)
    imageUrls.push(urlData.publicUrl)
  }

  const { error } = await supabase.from('posts').insert({
    caption: document.getElementById('caption').value,
    image: imageUrls,
    author: document.getElementById('author').value
  })

  if (error) { status.innerText = 'DB error: ' + error.message }
  else { status.innerText = 'POSTED! ✅ Go check your site' }
}
</script>
</body>
</html>
